<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>ARC Raiders Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>ARC Raiders Dashboard</h1>
        </header>

        <nav>
            <button class="menu-btn" onclick="showSection('arc-raiders-section')">Arc Raiders</button>
            <button class="menu-btn" onclick="showSection('streamers-section')">Стримерам</button>
            <button class="menu-btn" onclick="showSection('clan-section')">Клан NE</button>
            <button class="menu-btn" onclick="showSection('info-section')">Информация</button>
            <button class="menu-btn" onclick="showSection('feedback-section')">Обратная связь</button>
        </nav>

        <main>
            <section id="arc-raiders-section" class="section">
                <h2>Arc Raiders</h2>
                <div class="submenu">
                    <button class="submenu-btn" onclick="showSubSection('events-sub')">Событие</button>
                    <button class="submenu-btn" onclick="showSubSection('news-sub')">Новости</button>
                    <button class="submenu-btn" onclick="showSubSection('trials-sub')">Испытание</button>
                    <button class="submenu-btn" onclick="showSubSection('guides-sub')">Гайды</button>
                </div>
                <div id="events-sub" class="sub-section">
                    <h3>Активные и предстоящие события</h3>
                    <div id="events-container">
                        <div id="active-events"></div>
                        <div id="upcoming-events"></div>
                    </div>
                </div>
                <div id="news-sub" class="sub-section">
                    <h3>Новости игры</h3>
                    <div id="news-container"></div>
                </div>
                <div id="trials-sub" class="sub-section"><p>Испытания</p></div>
                <div id="guides-sub" class="sub-section"><p>Гайды</p></div>
            </section>

            <section id="streamers-section" class="section">
                <h2>Стримерам</h2>
                <p>Добавьте бота в свой Telegram-канал.</p>
            </section>
            <section id="clan-section" class="section"><h2>Клан NE</h2><p>Информация о клане.</p></section>
            <section id="info-section" class="section"><h2>Информация</h2><p>Об игре.</p></section>
            <section id="feedback-section" class="section"><h2>Обратная связь</h2><p>Напишите нам.</p></section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
