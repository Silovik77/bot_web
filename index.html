<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>События - Arc Raiders</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Дополнительные стили для страницы событий */
        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
            padding: 10px;
            background-color: #f8f9fa;
            border-radius: 5px;
        }
        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .filter-group label {
            font-size: 0.9em;
            font-weight: bold;
            color: #495057;
        }
        .filter-group select {
            padding: 8px 12px;
            border: 1px solid #ced4da;
            border-radius: 4px;
            background-color: white;
            font-size: 0.9em;
            color: #495057;
        }
        .events-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 15px;
        }
        .event-item {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            background: #fafafa;
        }
        .event-item.active {
            border-left: 5px solid #28a745; /* Зелёная граница для активных */
            background-color: #e8f5e9; /* Лёгкий зелёный фон */
        }
        .event-item.upcoming {
            border-left: 5px solid #ffc107; /* Жёлтая граница для предстоящих */
            background-color: #fff3cd; /* Лёгкий жёлтый фон */
        }
        .event-item h4 {
            margin-top: 0;
            color: #333;
        }
        .event-item p {
            margin: 5px 0;
            color: #666;
        }
        .time-left, .time-to-start {
            font-style: italic;
            color: #555;
        }
        .no-events {
            text-align: center;
            color: #6c757d;
            font-style: italic;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <button class="back-btn" onclick="history.back()">← Назад</button>
        <header>
            <h2>События</h2>
        </header>

        <!-- Панель фильтров -->
        <div class="filter-bar">
            <div class="filter-group">
                <label for="map-filter">Фильтр по карте:</label>
                <select id="map-filter">
                    <option value="">Все карты</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="event-type-filter">Тип события:</label>
                <select id="event-type-filter">
                    <option value="">Все типы</option>
                    <option value="active">Активные</option>
                    <option value="upcoming">Предстоящие</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="event-name-filter">Фильтр по событию:</label>
                <select id="event-name-filter">
                    <option value="">Все события</option>
                </select>
            </div>
        </div>

        <!-- Контейнер для событий -->
        <div id="events-container">
            <div id="events-grid" class="events-grid">
                <!-- События будут отображаться здесь -->
            </div>
            <div id="no-events-message" class="no-events" style="display: none;">
                Нет событий, соответствующих фильтрам.
            </div>
        </div>
    </div>

    <script>
        // --- СЛОВАРИ ПЕРЕВОДА (основаны на предоставленных вами данных) ---
        const TRANSLATE_MAP = {
            'Blue Gate': 'Синие врата',
            'Spaceport': 'Космопорт',
            'Dam': 'Плотина',
            'Stella Montis': 'Стелла Монти',
            'Buried City': 'Закопанный город',
            'The Core': 'Ядро', // Добавлено из старого списка
            'The Ruins': 'Руины', // Добавлено из старого списка
            'The Vault': 'Хранилище', // Добавлено из старого списка
            'The Outpost': 'Пост', // Добавлено из старого списка
            'The Lab': 'Лаборатория', // Добавлено из старого списка
            // Добавьте сюда больше карт по мере необходимости
        };

        const TRANSLATE_EVENT = {
            'Locked Gate': 'Закрытые врата',
            'Launch Tower Loot': 'Добыча с башни запуска',
            'Cold Snap': 'Холодная волна',
            'Harvester': 'Жнец',
            'Matriarch': 'Матриарх',
            'Night Raid': 'Ночной рейд',
            'Bird City': 'Птичий город',
            'Prospecting Probes': 'Геологические зонды',
            'Electromagnetic Storm': 'Электромагнитная буря',
            'Hidden Bunker': 'Скрытый бункер',
            'Husk Graveyard': 'Кладбище кукол',
            'Lush Blooms': 'Пышные цветы',
            'Uncovered Caches': 'Обнаруженные тайники',
            'Extraction Raid': 'Рейд по добыче', // Добавлено из старого списка
            'Survival Test': 'Тест выживания', // Добавлено из старого списка
            'Team Deathmatch': 'Командный бой насмерть', // Добавлено из старого списка
            'Capture the Objective': 'Захват цели', // Добавлено из старого списка
            // Добавьте сюда больше событий по мере необходимости
        };

        // --- ОБНОВЛЕНИЕ СПИСКА СОБЫТИЙ ---
        async function loadEvents() {
            const eventsGrid = document.getElementById('events-grid');
            const noEventsMessage = document.getElementById('no-events-message');
            if (!eventsGrid) return;

            try {
                // ИСПОЛЬЗУЕМ ВАШ ДОМЕН
                const response = await fetch('https://silovik-silovik.waw0.amvera.tech/api/user_events');
                if (!response.ok) throw new Error('Network response was not ok');
                const data = await response.json();

                // Очищаем сетку событий
                eventsGrid.innerHTML = '';

                // Собираем все уникальные карты и события из данных
                const mapsSet = new Set();
                const eventsSet = new Set();
                [...(data.active || []), ...(data.upcoming || [])].forEach(e => {
                    mapsSet.add(e.location);
                    eventsSet.add(e.name);
                });

                // Заполняем фильтр по картам
                const mapSelect = document.getElementById('map-filter');
                // Очищаем старые опции, кроме первой ("Все карты")
                mapSelect.innerHTML = '<option value="">Все карты</option>';
                mapsSet.forEach(map => {
                    const option = document.createElement('option');
                    option.value = map;
                    option.textContent = TRANSLATE_MAP[map] || map; // Показываем перевод или оригинальное имя
                    mapSelect.appendChild(option);
                });

                // Заполняем фильтр по событиям
                const eventSelect = document.getElementById('event-name-filter');
                // Очищаем старые опции, кроме первой ("Все события")
                eventSelect.innerHTML = '<option value="">Все события</option>';
                eventsSet.forEach(eventName => {
                    const option = document.createElement('option');
                    option.value = eventName;
                    option.textContent = TRANSLATE_EVENT[eventName] || eventName; // Показываем перевод или оригинальное имя
                    eventSelect.appendChild(option);
                });

                // Объединяем активные и предстоящие события в один массив, добавляя тип
                const allEvents = [];
                if (data.active && data.active.length > 0) {
                    data.active.forEach(event => {
                        allEvents.push({...event, type: 'active'});
                    });
                }
                if (data.upcoming && data.upcoming.length > 0) {
                    data.upcoming.forEach(event => {
                        allEvents.push({...event, type: 'upcoming'});
                    });
                }

                // Функция для отображения событий с учетом фильтров
                function renderEvents(eventsToRender) {
                    eventsGrid.innerHTML = ''; // Очищаем перед рендером

                    if (eventsToRender.length === 0) {
                        noEventsMessage.style.display = 'block';
                        return;
                    }

                    noEventsMessage.style.display = 'none';

                    eventsToRender.forEach(event => {
                        const el = document.createElement('div');
                        el.className = `event-item ${event.type}`;
                        // Применяем перевод к имени события и локации
                        const eventName = TRANSLATE_EVENT[event.name] || event.name;
                        const eventLocation = TRANSLATE_MAP[event.location] || event.location;

                        if (event.type === 'active') {
                            el.innerHTML = `
                                <h4>✅ ${eventName}</h4>
                                <p><strong>Карта:</strong> ${eventLocation}</p>
                                <p class="time-left">⏱️ Осталось: ${event.time_left}</p>
                            `;
                        } else { // upcoming
                            el.innerHTML = `
                                <h4>⏳ ${eventName}</h4>
                                <p><strong>Карта:</strong> ${eventLocation}</p>
                                <p class="time-to-start">⏰ Начнётся через: ${event.time_left}</p>
                            `;
                        }
                        eventsGrid.appendChild(el);
                    });
                }

                // Инициализируем отображение всех событий
                renderEvents(allEvents);

                // Добавляем обработчики фильтрации
                const mapFilter = document.getElementById('map-filter');
                const eventTypeFilter = document.getElementById('event-type-filter');
                const eventNameFilter = document.getElementById('event-name-filter'); // Новый фильтр

                function applyFilters() {
                    const selectedMap = mapFilter.value;
                    const selectedType = eventTypeFilter.value;
                    const selectedEventName = eventNameFilter.value; // Новое значение

                    let filteredEvents = allEvents;

                    if (selectedMap !== '') {
                        filteredEvents = filteredEvents.filter(e => e.location === selectedMap);
                    }

                    if (selectedType !== '') {
                        filteredEvents = filteredEvents.filter(e => e.type === selectedType);
                    }

                    if (selectedEventName !== '') { // Новая проверка
                        filteredEvents = filteredEvents.filter(e => e.name === selectedEventName);
                    }

                    renderEvents(filteredEvents);
                }

                mapFilter.addEventListener('change', applyFilters);
                eventTypeFilter.addEventListener('change', applyFilters);
                eventNameFilter.addEventListener('change', applyFilters); // Новый обработчик

            } catch (e) {
                console.error('Ошибка загрузки событий:', e);
                eventsGrid.innerHTML = '<p class="no-events">Ошибка загрузки событий.</p>';
            }
        }

        // Загружаем события при загрузке страницы
        document.addEventListener('DOMContentLoaded', loadEvents);
    </script>
</body>
</html>
